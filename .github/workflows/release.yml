name: Release

# Calendar versions (YY.M.R, the same scheme as @n-uf/hypr-tiling). A PR bumps
# packages/debugsy/package.json with `pnpm version:bump` and adds a CHANGELOG
# entry; merging it to main publishes that version to npmjs (public, with
# provenance) and to GitHub Packages, tags it v<version> and notifies
# finfactory/pdf-n-uf. Each registry is checked on its own: a run publishes
# only where the version is missing, so re-runs are safe, and a push whose
# version is everywhere already only deploys the site.
#
# Two jobs: `verify` is read-only; `publish` has write access and only runs
# after `verify` passed. `publish` packs one tarball with pnpm (which applies
# publishConfig: the published exports point at dist/) and publishes that
# same file to both registries.
#
# Tokens, each exposed only to the steps that need it:
# - NPM_TOKEN (repo secret): a granular npmjs token with read and write access
#   to the @n-uf scope. Trusted publishing (OIDC) can replace it once the
#   package exists on npmjs.
# - GITHUB_TOKEN: installs @n-uf packages from GitHub Packages and publishes
#   there.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint, check types, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@n-uf"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint, check types, test, build the package
        run: |
          pnpm turbo lint check-types test
          pnpm --filter @n-uf/debugsy build

  publish:
    name: Publish the version where it's new
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # npm provenance
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN != '' }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      NPMJS: https://registry.npmjs.org
      GHPKG: https://npm.pkg.github.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@n-uf"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version packages/debugsy/package.json)
          if ! echo "$version" | grep -qE '^[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+$'; then
            echo "::error::$version is not a calendar version (YY.M.R)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # is_new <registry> <output name>: true when the version isn't there yet
          is_new() {
            local out
            if out=$(npm view "@n-uf/debugsy@$version" version --registry "$1" --@n-uf:registry="$1" 2>&1); then
              echo "$2=false" >> "$GITHUB_OUTPUT"
              echo "::notice::@n-uf/debugsy@$version is already on $1."
            elif echo "$out" | grep -qE 'E404|No match found|is not in this registry'; then
              echo "$2=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Could not check $1: $out"
              exit 1
            fi
          }
          is_new "$NPMJS" npm
          is_new "$GHPKG" github

          # Tagged separately, so a re-run after a failed tag step still tags.
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        id: pack
        if: steps.version.outputs.npm == 'true' || steps.version.outputs.github == 'true'
        run: |
          dest="$RUNNER_TEMP/package"
          mkdir -p "$dest"
          # prepack builds dist/ and checks it (scripts/check-dist.mjs)
          pnpm --filter @n-uf/debugsy pack --pack-destination "$dest"
          tarball=$(ls "$dest"/*.tgz)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          tar -tzf "$tarball"

      - name: Publish to npmjs
        if: steps.version.outputs.npm == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if [ "$HAS_NPM_TOKEN" != "true" ]; then
            echo "::error::The NPM_TOKEN secret is not set, so the version can't be published to npmjs."
            exit 1
          fi
          # A config of its own, so the npmjs token never sits in the shared one
          rc="$RUNNER_TEMP/npmjs.npmrc"
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$rc"
          npm publish "$TARBALL" --userconfig "$rc" --access public --provenance \
            --registry "$NPMJS" --@n-uf:registry="$NPMJS"

      - name: Publish to GitHub Packages
        if: steps.version.outputs.github == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          npm publish "$TARBALL" --registry "$GHPKG" --@n-uf:registry="$GHPKG"

      - name: Tag
        if: steps.version.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # Once per version: when this run creates its tag
      - name: Notify pdf-n-uf (lib-released)
        if: steps.version.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ "$HAS_DISPATCH_TOKEN" != "true" ]; then
            echo "::notice::DISPATCH_TOKEN secret is not set; skipping the lib-released dispatch."
            exit 0
          fi
          jq -n -c --arg v "$VERSION" --arg sha "$(git rev-parse HEAD)" \
            '{event_type: "lib-released", client_payload: {source: "n-uf/debugsy", sha: $sha, packages: [{name: "@n-uf/debugsy", version: $v}]}}' \
            | gh api repos/finfactory/pdf-n-uf/dispatches --method POST --input -
