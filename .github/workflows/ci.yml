name: CI

on:
  pull_request:
    # Draft PRs are not checked; marking one ready starts the run.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: lint / check-types / build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # Writes a user-level .npmrc with the registry token: pnpm ignores
          # ${ENV} tokens from the project .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: "@n-uf"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # @n-uf/harbuz comes from GitHub Packages. GITHUB_TOKEN reads it only
          # once the package grants this repo access (Package settings >
          # Manage Actions access).
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint, check types, build
        run: pnpm turbo run lint check-types build
